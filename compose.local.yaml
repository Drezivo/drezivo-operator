name: drezivo-operator-local
services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: operator_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [operator-db-superadmin:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d operator_local]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [isolated]
  init:
    build: { context: ., dockerfile: local/Dockerfile }
    image: drezivo-operator-local:dev
    command: [node, local/bootstrap.mjs]
    environment: { NODE_ENV: development }
    secrets: [credentials]
    volumes:
      - ./local:/workspace/local:ro
      - ../Drezivo-Operator-Business-Local/api/src/db/migrations:/business-migrations:ro
    depends_on: { db: { condition: service_healthy } }
    networks: [isolated]
  api:
    image: drezivo-operator-local:dev
    command: [node, --import, tsx, api/src/local-server.ts]
    environment: { NODE_ENV: development, PORT: 5080, OPERATOR_API_HOST: 0.0.0.0 }
    secrets: [credentials]
    volumes:
      - ./api/src:/workspace/api/src:ro
      - ./local:/workspace/local:ro
    depends_on: { init: { condition: service_completed_successfully } }
    networks: [isolated]
  web:
    image: drezivo-operator-local:dev
    command: [npm, run, dev, --workspace, '@drezivo/operator-web', --, --hostname, 0.0.0.0, --webpack]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_OPERATOR_LOCAL_MODE: 'true'
      NEXT_PUBLIC_DREZIVO_API_BASE_URL: http://localhost:5080/api/v1
      NEXT_PUBLIC_OPERATOR_VIEWS: overview,analytics,clients,subscriptions,entitlements,operators,grants,audit,jobs,notifications,payments,payment-methods
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./web/src:/workspace/web/src:ro
      - ./web/next.config.ts:/workspace/web/next.config.ts:ro
      - ./web/vitest.config.ts:/workspace/web/vitest.config.ts:ro
    depends_on: [api]
    networks: [isolated]
  gateway:
    image: nginx:1.27-alpine
    ports: ['127.0.0.1:3010:3010', '127.0.0.1:5080:5080']
    volumes: ['./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api, web]
    networks: [isolated, loopback]
  test-db:
    image: postgres:17.11-alpine3.24
    profiles: [integration]
    environment:
      POSTGRES_DB: operator_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d operator_test]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [isolated]
  integration:
    image: drezivo-operator-local:dev
    profiles: [integration]
    command: [npm, run, 'test:integration', --workspace, '@drezivo/operator-api']
    environment:
      NODE_ENV: test
      OPERATOR_LOCAL_IT: 'true'
      TENANT_ADMIN_IT_MIGRATIONS_DIR: /business-migrations
    secrets: [credentials]
    volumes:
      - ./api/src:/workspace/api/src:ro
      - ./api/test:/workspace/api/test:ro
      - ../Drezivo-Operator-Business-Local/api/src/db/migrations:/business-migrations:ro
    depends_on: { test-db: { condition: service_healthy } }
    networks: [isolated]
  checks:
    image: drezivo-operator-local:dev
    profiles: [checks]
    command: [sh, -c, 'npm run typecheck && npm run lint && npm test && npm run build']
    volumes:
      - ./api/src:/workspace/api/src:ro
      - ./local:/workspace/local:ro
      - ./api/test:/workspace/api/test:ro
      - ./web/src:/workspace/web/src:ro
      - ./web/next.config.ts:/workspace/web/next.config.ts:ro
      - ./web/vitest.config.ts:/workspace/web/vitest.config.ts:ro
    environment: { NODE_ENV: test, NEXT_TELEMETRY_DISABLED: '1' }
    networks: [isolated]
secrets:
  credentials: { file: .local/credentials.json }
  postgres-password: { file: .local/postgres-password }
volumes:
  operator-db-superadmin:
networks:
  loopback:
  isolated:
    internal: true
